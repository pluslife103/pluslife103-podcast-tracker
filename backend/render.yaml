services:
  - type: web
    name: gooaye-podcast-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: gooaye-podcast-db
          property: connectionString

databases:
  - name: gooaye-podcast-db
    databaseName: podcast
    user: podcast
